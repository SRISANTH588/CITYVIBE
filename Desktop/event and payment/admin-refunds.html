<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>cityvibe | Admin Refunds</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/styles.css" /><style>body{margin:0;font-family:Manrope,sans-serif;background:linear-gradient(180deg,#eff4ff,#f7faff 48%,#eef3fb);color:#0f172a}.shell{max-width:1440px;margin:0 auto;padding:1.25rem;display:grid;grid-template-columns:280px 1fr;gap:1rem;min-height:100vh}.sidebar,.panel,.modal-card{background:rgba(255,255,255,.9);border:1px solid rgba(18,66,197,.12);box-shadow:0 24px 60px rgba(15,23,42,.08);backdrop-filter:blur(14px)}.sidebar{border-radius:28px;padding:1.2rem;position:sticky;top:1.25rem;height:fit-content;display:grid;gap:1rem}.pill{display:inline-flex;width:fit-content;padding:.35rem .7rem;border-radius:999px;background:#dbe6ff;color:#1242c5;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:.55rem}.nav a,.nav button,.btn,.inline-btn{border:0;border-radius:16px;padding:.9rem 1rem;font-weight:800;cursor:pointer;text-decoration:none}.nav a,.nav button{background:#f8fbff;color:#13203a;text-align:left}.btn.primary,.inline-btn.primary{background:linear-gradient(180deg,#2f6bff,#1242c5);color:#fff}.btn.secondary,.inline-btn.secondary{background:#fff;color:#1242c5;border:1px solid rgba(18,66,197,.16)}.content{display:grid;gap:1rem}.hero,.panel{border-radius:28px;padding:1.15rem}.hero{background:linear-gradient(135deg,rgba(18,66,197,.98),rgba(24,108,255,.9));color:#fff;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}.card,.item{padding:.95rem 1rem;border-radius:18px;background:#f8fbff;border:1px solid rgba(18,66,197,.08)}.stack{display:grid;gap:.85rem;margin-top:1rem}. -refund-edit="${p.id}">Refund control</button><button class="inline-btn secondary" data-payment-archive="${p.id}">Archive</button></div></div>`).join("");refundPayment.innerHTML=payments.map((p)=>`<option value="${p.id}">${esc(p.receipt||p.id)} - ${esc(p.status||"created")}</option>`).join("");bind();}function bind(){document.querySelectorAll("[data-refund-edit]").forEach((b)=>b.onclick=()=>{const p=latestPayments.find((x)=>x.id===b.dataset.refundEdit);if(!p)return;refundPayment.value=p.id;refundStatus.value=p.status==="refunded"?"refunded":p.status==="review"?"review":"refund_pending";refundReason.value=p.refundReason||"";open();});document.querySelectorAll("[data-payment-archive]").forEach((b)=>b.onclick=async()=>{if(confirm("Archive this payment record?")) await updateDoc(doc(db,"payments",b.dataset.paymentArchive),{archived:true,updatedAt:serverTimestamp()});});}onSnapshot(query(collection(db,"payments"),orderBy("createdAt","desc"),limit(50)),(snap)=>render(snap.docs.map((d)=>({id:d.id,...d.data()})).filter((p)=>!p.archived)));document.getElementById("refundForm").addEventListener("submit",async(e)=>{e.preventDefault();await updateDoc(doc(db,"payments",refundPayment.value),{status:refundStatus.value,refundReason:refundReason.value.trim(),updatedAt:serverTimestamp()});close();});document.querySelectorAll("[data-close]").forEach((b)=>b.onclick=()=>close());document.getElementById("openRefund").onclick=()=>open();document.getElementById("logoutBtn").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST",credentials:"include"});try{await signOut(auth)}catch{}window.location.href="/login.html"};document.getElementById("refreshBtn").onclick=async()=>{const r=await fetch("/api/auth/me",{credentials:"include"});if(!r.ok)return window.location.href="/login.html";const p=await r.json();document.getElementById("welcome").textContent=`Welcome back, ${p.user.name || "Admin"}`;};(async()=>{const r=await fetch("/api/auth/me",{credentials:"include"});if(!r.ok)return wi
