<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RYDEX | Login</title>
    <meta name="description" content="Login to RYDEX." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body class="app-body">
    <div class="auth-shell">
      <header class="auth-header">
        <div class="top-left">
          <div class="brand-mark">R</div>
          <div>
            <strong class="brand-name">RYDEX</strong>
            <p class="brand-sub">Login</p>
          </div>
        </div>
        <a class="ghost-link" href="index.html">Back</a>
      </header>

      <main class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-copy">Login to book a ride, manage your trips, and track your rider.</p>

        <form class="auth-form">
          <label>
            Mobile number
            <input type="tel" placeholder="Enter mobile number" />
          </label>
          <label>
            Password
            <input type="password" placeholder="Enter password" />
          </label>
          <button class="submit-btn" type="button">Login</button>
          <a class="text-link center" href="customer.html">Continue as customer</a>
        </form>
      </main>
    </div>
  </body>
</html>
