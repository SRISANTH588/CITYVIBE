<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RYDEX | Customer</title>
    <meta name="description" content="Customer booking page for RYDEX." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <div class="auth-shell">
      <header class="auth-header">
        <div class="top-left">
          <div class="brand-mark">R</div>
          <div>
            <strong class="brand-name">RYDEX</strong>
            <p class="brand-sub">Customer</p>
          </div>
        </div>
        <a class="ghost-link" href="index.html">Open map</a>
      </header>

      <main class="auth-card">
        <h1>Book your ride</h1>
        <p class="auth-copy">Enter your pickup and destination, then choose a service and payment method.</p>

        <form class="auth-form">
          <label>
            Pickup location
            <input type="text" placeholder="Enter pickup location" />
          </label>
          <label>
            Destination
            <input type="text" placeholder="Enter destination" />
          </label>
          <button class="submit-btn" type="button">Search riders</button>
        </form>
      </main>
    </div>
  </body>
</html>
