<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>cityvibe | Admin Events</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/styles.css" /><style>body{margin:0;font-family:Manrope,sans-serif;background:linear-gradient(180deg,#eff4ff,#f7faff 48%,#eef3fb);color:#0f172a}.shell{max-width:1440px;margin:0 auto;padding:1.25rem;display:grid;grid-template-columns:280px 1fr;gap:1rem;min-height:100vh}.sidebar,.panel,.modal-card{background:rgba(255,255,255,.9);border:1px solid rgba(18,66,197,.12);box-shadow:0 24px 60px rgba(15,23,42,.08);backdrop-filter:blur(14px)}.sidebar{border-radius:28px;padding:1.2rem;position:sticky;top:1.25rem;height:fit-content;display:grid;gap:1rem}.pill{display:inline-flex;width:fit-content;padding:.35rem .7rem;border-radius:999px;background:#dbe6ff;color:#1242c5;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:.55rem}.nav a,.nav button,.btn,.inline-btn{border:0;border-radius:16px;padding:.9rem 1rem;font-weight:800;cursor:pointer;text-decoration:none}.nav a,.nav button{background:#f8fbff;color:#13203a;text-align:left}.btn.primary,.inline-btn.primary{background:linear-gradient(180deg,#2f6bff,#1242c5);color:#fff}.btn.secondary,.inline-btn.secondary{background:#fff;color:#1242c5;border:1px solid rgba(18,66,197,.16)}.content{display:grid;gap:1rem}.hero,.panel{border-radius:28px;padding:1.15rem}.hero{background:linear-gradient(135deg,rgba(18,66,197,.98),rgba(24,108,255,.9));color:#fff;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}.card,.item{padding:.95rem 1rem;border-radius:18px;background:#f8fbff;border:1px solid rgba(18,66,197,.08)}.stack{display:grid;gap:.85rem;margin-top:1rem}.mini-actions{display:flex;gap:.5rem;flex-wrap:wrap}.inline-btn{padding:.6rem .8rem;font-size:.84rem}.muted{color:#64748b}@media (max-width:1100px){.shell{grid-template-columns:1fr}.sidebar{position:static}}</style></head><body><main class="shell"><aside class="sidebar"><div><span class="pill">cityvibe</span><strong style="display:block;font-size:1.6rem;letter-spacing:-.05em">Admin Control</strong><span class="muted" id="welcome">Manage events</span></div><nav class="nav"><a href="/dashboard/admin">Overview</a><a href="/dashboard/admin/users">Users</a><a href="/dashboard/admin/events">Events</a><a href="/dashboard/admin/refunds">Refunds</a></nav><div class="nav"><a class="btn secondary" href="/index.html">Home</a><button class="btn primary" id="refreshBtn" type="button">Refresh</button><button class="btn secondary" id="logoutBtn" type="button">Logout</button></div></aside><section class="content"><header class="hero"><div><span class="pill">Events</span><h1 style="margin:0;letter-spacing:-.05em">Publish events</h1><p>Create or update listings.</p></div><button class="btn secondary" id="openPublish">New event</button></header><section class="panel"><div class="stack" id="eventCards"></div></section></section></main><div class="modal" id="eventModal" aria-hidden="true"><div class="modal-card"><header><div><span class="pill">Publish event</span><h3>Create a live event listing</h3></div><button class="close-btn" type="button" data-close="eventModal">x</button></header><form id="eventForm"><div class="form-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:1rem"><label>Event name<input id="eventName" type="text"></label><label>City<input id="eventCity" type="text"></label><label>Price<input id="eventPrice" type="number" min="0" step="1"></label><label>Category<select id="eventCategory"><option value="music">Music</option><option value="business">Business</option><option value="food">Food</option><option value="community">Community</option></select></label></div><label style="margin-top:.8rem;display:grid;gap:.35rem;font-weight:800">Notes<textarea id="eventNotes"></textarea></label><div class="form-actions" style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem"><button class="btn primary" type="submit">Publish event</button><button class="btn secondary" type="button" data-close="eventModal">Cancel</button></div></form></div></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const app=initializeApp({ apiKey:"AIzaSyBCgNQy8EJLg7E-SA1cMePGetWLOR7WWMI", authDomain:"ogshootsluxe-36740.firebaseapp.com", projectId:"ogshootsluxe-36740", storageBucket:"ogshootsluxe-36740.firebasestorage.app", messagingSenderId:"5471814825", appId:"1:5471814825:web:07e84f2f88486da817d5b8" });const auth=getAuth(app),db=getFirestore(app),eventCards=document.getElementById("eventCards"),eventModal=document.getElementById("eventModal");let latestEvents=[];const esc=(v)=>String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");const open=()=>{eventModal.classList.add("open");eventModal.setAttribute("aria-hidden","false")};const close=()=>{eventModal.classList.remove("open");eventModal.setAttribute("aria-hidden","true")};function render(events){latestEvents=events;eventCards.innerHTML=events.map((e)=>`<div class="card"><strong>${esc(e.name||"Untitled event")}</strong><span>${esc(e.city||"Unknown city")} | ${esc(e.category||"general")}</span><span>${esc(e.status||"draft")} | ₹${Number(e.price||0).toLocaleString("en-IN")}</span><div class="mini-actions" style="margin-top:.65rem;"><button class="inline-btn secondary" data-event-edit="${e.id}">Publish / edit</button><button class="inline-btn secondary" data-event-archive="${e.id}">Archive</button><button class="inline-btn secondary" data-event-delete="${e.id}">Delete</button></div></div>`).join("");bind();}function bind(){document.querySelectorAll("[data-event-edit]").forEach((b)=>b.onclick=()=>{const e=latestEvents.find((x)=>x.id===b.dataset.eventEdit);if(!e)return;document.getElementById("eventName").value=e.name||"";document.getElementById("eventCity").value=e.city||"";document.getElementById("eventPrice").value=e.price||0;document.getElementById("eventCategory").value=e.category||"music";document.getElementById("eventNotes").value=e.notes||"";open();});document.querySelectorAll("[data-event-archive]").forEach((b)=>b.onclick=async()=>{if(confirm("Archive this event?")) await updateDoc(doc(db,"events",b.dataset.eventArchive),{archived:true,updatedAt:serverTimestamp(),status:"archived"});});document.querySelectorAll("[data-event-delete]").forEach((b)=>b.onclick=async()=>{if(confirm("Delete this event permanently?")) await deleteDoc(doc(db,"events",b.dataset.eventDelete));});}onSnapshot(query(collection(db,"events"),orderBy("createdAt","desc"),limit(50)),(snap)=>render(snap.docs.map((d)=>({id:d.id,...d.data()})).filter((e)=>!e.archived)));document.getElementById("eventForm").addEventListener("submit",async(e)=>{e.preventDefault();await addDoc(collection(db,"events"),{name:document.getElementById("eventName").value.trim(),city:document.getElementById("eventCity").value.trim(),price:Number(document.getElementById("eventPrice").value||0),category:document.getElementById("eventCategory").value,notes:document.getElementById("eventNotes").value.trim(),status:"published",updatedAt:serverTimestamp(),createdAt:serverTimestamp()});close();});document.querySelectorAll("[data-close]").forEach((b)=>b.onclick=()=>close());document.getElementById("openPublish").onclick=()=>open();document.getElementById("logoutBtn").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST",credentials:"include"});try{await signOut(auth)}catch{}window.location.href="/login.html"};document.getElementById("refreshBtn").onclick=async()=>{const r=await fetch("/api/auth/me",{credentials:"include"});if(!r.ok)return window.location.href="/login.html";const p=await r.json();document.getElementById("welcome").textContent=`Welcome back, ${p.user.name || "Admin"}`;};(async()=>{const r=await fetch("/api/auth/me",{credentials:"include"});if(!r.ok)return window.location.href="/login.html";const p=await r.json();document.getElementById("welcome").textContent=`Welcome back, ${p.user.name || "Admin"}`;})();</script></body></html>
